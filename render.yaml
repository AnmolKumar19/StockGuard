# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Single free PostgreSQL database shared by both services to fit Render's
# 1-free-database-per-workspace limit, alongside the three Docker web services.

databases:
  - name: stockguard-inventory-db
    databaseName: inventory_db
    user: inventory
    plan: free
    region: oregon

services:
  - type: web
    name: stockguard-inventory
    runtime: docker
    repo: https://github.com/Anmolkumar19/StockGuard
    dockerfilePath: ./inventory-service/Dockerfile
    dockerContext: ./inventory-service
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: INVENTORY_DB_HOST
        fromDatabase: { name: stockguard-inventory-db, property: host }
      - key: INVENTORY_DB_PORT
        fromDatabase: { name: stockguard-inventory-db, property: port }
      - key: INVENTORY_DB_NAME
        fromDatabase: { name: stockguard-inventory-db, property: database }
      - key: INVENTORY_DB_USER
        fromDatabase: { name: stockguard-inventory-db, property: user }
      - key: INVENTORY_DB_PASSWORD
        fromDatabase: { name: stockguard-inventory-db, property: password }
      - key: INVENTORY_DB_SSLMODE
        value: require

  - type: web
    name: stockguard-order
    runtime: docker
    repo: https://github.com/Anmolkumar19/StockGuard
    dockerfilePath: ./order-service/Dockerfile
    dockerContext: ./order-service
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: ORDER_DB_HOST
        fromDatabase: { name: stockguard-inventory-db, property: host }
      - key: ORDER_DB_PORT
        fromDatabase: { name: stockguard-inventory-db, property: port }
      - key: ORDER_DB_NAME
        fromDatabase: { name: stockguard-inventory-db, property: database }
      - key: ORDER_DB_USER
        fromDatabase: { name: stockguard-inventory-db, property: user }
      - key: ORDER_DB_PASSWORD
        fromDatabase: { name: stockguard-inventory-db, property: password }
      - key: ORDER_DB_SSLMODE
        value: require
      - key: INVENTORY_SCHEME
        value: https
      # Public hostname of the inventory service (update if Render suffixes the URL).
      - key: INVENTORY_HOST
        value: stockguard-inventory.onrender.com

  - type: web
    name: stockguard-web
    runtime: docker
    repo: https://github.com/Anmolkumar19/StockGuard
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    region: oregon
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PROXY_SCHEME
        value: https
      # Public hostnames of the two services (update if Render suffixes either URL).
      - key: INVENTORY_UPSTREAM_HOST
        value: stockguard-inventory.onrender.com
      - key: ORDER_UPSTREAM_HOST
        value: stockguard-order.onrender.com